name: DOF content and task policy checks

on:
  pull_request:
    paths:
      - "content/**"
      - "scenarios/**"
      - "Scripts/Game/DOF/Core/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/mission-preflight.yml"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scenarios/**"
      - "Scripts/Game/DOF/Core/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/mission-preflight.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate original DOF reference mission (Python only)
        run: python3 tools/validate_mission_manifest.py scenarios/reference_arland/mission.json
      - name: Validate 800 narrative design missions (Python only)
        run: python3 tools/validate_mission_library.py content/missions
      - name: Unit tests for design content and reference task policy (Python only)
        run: python3 -m unittest discover -s tests -v
      - name: Simulate reference task chain (Python only)
        run: python3 tools/simulate_reference_mission.py scenarios/reference_arland/mission.json
