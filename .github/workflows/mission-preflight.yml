name: Mission manifest and task policy preflight

on:
  pull_request:
    paths:
      - "scenarios/**"
      - "Scripts/Game/DOF/Core/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/mission-preflight.yml"
  push:
    branches: [main]
    paths:
      - "scenarios/**"
      - "Scripts/Game/DOF/Core/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/mission-preflight.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate DOF reference mission manifest (Python, not Workbench)
        run: python3 tools/validate_mission_manifest.py scenarios/reference_arland/mission.json
      - name: Run manifest and task reference policy tests (Python, not Enforce)
        run: python3 -m unittest discover -s tests -v
      - name: Simulate reference task chain (Python only)
        run: python3 tools/simulate_reference_mission.py scenarios/reference_arland/mission.json
