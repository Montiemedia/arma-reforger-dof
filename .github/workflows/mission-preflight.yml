name: Mission manifest preflight

on:
  pull_request:
    paths:
      - "scenarios/**"
      - "tools/validate_mission_manifest.py"
      - "tests/**"
      - ".github/workflows/mission-preflight.yml"
  push:
    branches: [main]
    paths:
      - "scenarios/**"
      - "tools/validate_mission_manifest.py"
      - "tests/**"
      - ".github/workflows/mission-preflight.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate DOF reference mission manifest
        run: python3 tools/validate_mission_manifest.py scenarios/reference_arland/mission.json
      - name: Run manifest validation tests
        run: python3 -m unittest discover -s tests -v
